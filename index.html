<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Vagner Nutri — Sistema de Gestão Nutricional</title>
    <meta name="description" content="Sistema de gestão completo para nutricionistas com cadastro de pacientes, acompanhamento de consultas, anamnese e planos alimentares." />
    
    <!-- PWA Primary Meta Tags -->
    <meta name="theme-color" content="#0b1120" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- iOS / Apple Meta Tags & Icons -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vagner Nutri" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration for PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('Service Worker PWA registrado com sucesso:', reg.scope))
            .catch((err) => console.warn('Falha ao registrar Service Worker PWA:', err));
        });
      }
    </script>
  </body>
</html>
